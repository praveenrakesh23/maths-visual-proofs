<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maths Universe - Math Visualizations & Proofs</title>
  
  <!-- Main Catalog Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-container">

  <!-- Left Navigation Sidebar -->
  <aside class="sidebar">
    <a href="#" class="brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18"/><path d="M3 12h18"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">MATHS</span>
        <span class="brand-subtitle">UNIVERSE</span>
      </div>
    </a>

    <ul class="nav-list">
      <li class="nav-item active">
        <a href="#">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="12 8 8 16 16 16 12 8"/></svg>
          Explore All
        </a>
      </li>
      <li class="nav-item">
        <a href="#calculus">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Calculus
        </a>
      </li>
      <li class="nav-item">
        <a href="#geometry">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          Geometry & Solids
        </a>
      </li>
      <li class="nav-item">
        <a href="#conics">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="5"/></svg>
          Conic Sections
        </a>
      </li>
      <li class="nav-item">
        <a href="#inequalities">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 6 4 14M12 6v14M8 6l-4 14"/></svg>
          Inequalities
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <p>Maths Universe Catalog</p>
      <p style="font-weight:700; margin-top:2px;">18 Interactive Modules</p>
    </div>
  </aside>

  <!-- Main Catalog Area -->
  <main class="main-content">

    <!-- Header Section -->
    <header class="catalog-header">
      <div class="header-title-group">
        <h1>Math Visualizations & Proofs</h1>
        <p>Explore interactive mathematical visualizations, experiments and visual proofs.</p>
      </div>

      <div class="counter-badge">
        <span class="counter-dot"></span>
        <span id="project-count">18 Interactive Visualizations</span>
      </div>
    </header>

    <!-- Toolbar: Search & Category Tabs -->
    <div class="toolbar-card">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search visualizations, topics, or formulas...">
      </div>

      <div class="category-tabs">
        <button class="tab-btn active" data-category="All">All</button>
        <button class="tab-btn" data-category="Calculus">Calculus</button>
        <button class="tab-btn" data-category="Geometry & Solids">Geometry & Solids</button>
        <button class="tab-btn" data-category="Conic Sections">Conic Sections</button>
        <button class="tab-btn" data-category="Inequalities">Inequalities</button>
      </div>
    </div>

    <!-- Catalog Content Grid -->
    <div id="catalog-content"></div>

  </main>
</div>

<!-- Main Catalog Application Script -->
<script src="app.js"></script>

</body>
</html>
